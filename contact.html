  <body>
    <header>
      <div class="header">
        <p class="header__logo"><a href="index.html">Helen Kohun</a></p>
        <nav class="header__nav">
          <ul>
            <li><a href="index.html">homepage</a></li>
            <li><a href="works.html">selected works</a></li>
            <li><a href="about.html">about</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="contact" id="contact-link">
        <div class="contact__wrapper">
          <div class="contact__info">
            <h2 class="contact__title-1">Contact information</h2>
            <h3 class="contact__title-2">
              I'm open to freelance projects, collaborations, <br />
              or full-time opportunities.
            </h3>
            <address>
              <dl>
                <dt>Phone</dt>
                <dd><a href="tel:+48578176513">+48 578 176 513</a></dd>
                <dt>Email</dt>
                <dd>
                  <a href="mailto:helenakohun@gmail.com"
                    >helenakohun@gmail.com</a
                  >
                </dd>
              </dl>
            </address>
          </div>

          <div class="contact__form">
            <div class="contact-frame">
              <h2 class="contact__title-3">Let's work together</h2>
              <form action="https://formspree.io/f/mwvzwbvw" method="POST">
                <input type="text" name="name" placeholder="Name" />
                <input type="text" name="surname" placeholder="Surname" />
                <input type="tel" name="phone" placeholder="Phone number" />
                <input type="email" name="email" placeholder="E-mail" />
                <textarea
                  name="message"
                  placeholder="Your message"
                  class="form__textarea"
                ></textarea>
                <button type="submit" class="contact__btn">Sumbit</button>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
  <footer>
    <div class="footer__wrapper">
      <p>Helen Kohun</p>
      <p>Web developer</p>
    </div>
